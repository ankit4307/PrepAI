<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PrepAI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background: linear-gradient(135deg, #eef5ff, #ffffff);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }


        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }


        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }


        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 10px;
        }


        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-top: 10px;
        }


        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }


        .form-label {
            font-weight: 600;
        }


        .form-control {
            padding: 12px;
            border-radius: 9px;
        }


        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
            border-color: #0d6efd;
        }


        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }


        .login-btn:hover {
            background: #0b5ed7;
        }


        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
        }


        .register-text a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }


        .back-home {
            text-align: center;
            margin-top: 15px;
        }


        .back-home a {
            color: #6b7280;
            text-decoration: none;
        }


        .back-home a:hover {
            color: #0d6efd;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            🎓 PrepAI
        </div>


        <h2 class="page-title">
            Welcome Back
        </h2>


        <p class="subtitle">
            Login to continue your placement preparation
        </p>


        <!-- SUCCESS MESSAGE -->

        {% if success %}

        <div class="alert alert-success text-center" role="alert">

            <i class="bi bi-check-circle-fill"></i>

            {{ success }}

        </div>

        {% endif %}


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="alert alert-danger text-center" role="alert">

            <i class="bi bi-exclamation-triangle-fill"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>


        </form>


        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <!-- BACK HOME -->

        <div class="back-home">

            <a href="/">

                <i class="bi bi-arrow-left"></i>

                Back to Home

            </a>

        </div>


    </div>

</div>


</body>

</html>
