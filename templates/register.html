<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | PrepAI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background: linear-gradient(135deg, #eef5ff, #ffffff);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }


        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }


        .register-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }


        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 8px;
        }


        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-top: 10px;
        }


        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }


        .form-label {
            font-weight: 600;
        }


        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 9px;
        }


        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
            border-color: #0d6efd;
        }


        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
        }


        .register-btn:hover {
            background: #0b5ed7;
        }


        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
        }


        .login-text a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }


        .back-home {
            text-align: center;
            margin-top: 15px;
        }


        .back-home a {
            color: #6b7280;
            text-decoration: none;
        }


        .back-home a:hover {
            color: #0d6efd;
        }

    </style>

</head>


<body>


<div class="register-container">

    <div class="register-card">


        <!-- LOGO -->

        <div class="logo">
            🎓 PrepAI
        </div>


        <h2 class="page-title">
            Create Your Account
        </h2>


        <p class="subtitle">
            Start your AI-powered placement preparation journey
        </p>


        <!-- SUCCESS MESSAGE -->

        {% if success %}

        <div class="alert alert-success text-center" role="alert">

            <i class="bi bi-check-circle-fill"></i>

            {{ success }}

        </div>

        {% endif %}


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="alert alert-danger text-center" role="alert">

            <i class="bi bi-exclamation-triangle-fill"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- REGISTRATION FORM -->

        <form method="POST" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <!-- FULL NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- COLLEGE -->

            <div class="mb-3">

                <label class="form-label">
                    College / University
                </label>

                <input
                    type="text"
                    name="college"
                    class="form-control"
                    placeholder="Enter your college or university"
                    required>

            </div>


            <div class="row">


                <!-- COURSE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <select
                        name="course"
                        class="form-select"
                        required>

                        <option value="">
                            Select Course
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="B.Sc">
                            B.Sc
                        </option>

                        <option value="M.Sc">
                            M.Sc
                        </option>

                        <option value="MBA">
                            MBA
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- GRADUATION YEAR -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Graduation Year
                    </label>

                    <select
                        name="graduation_year"
                        class="form-select"
                        required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="2026">
                            2026
                        </option>

                        <option value="2027">
                            2027
                        </option>

                        <option value="2028">
                            2028
                        </option>

                        <option value="2029">
                            2029
                        </option>

                        <option value="2030">
                            2030
                        </option>

                    </select>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn">

                <i class="bi bi-person-plus"></i>

                Create Account

            </button>


        </form>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


        <!-- BACK HOME -->

        <div class="back-home">

            <a href="/">

                <i class="bi bi-arrow-left"></i>

                Back to Home

            </a>

        </div>


    </div>

</div>


</body>

</html>
